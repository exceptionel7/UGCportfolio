<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course | Exceptionel Creator Academy</title>
  <meta name="description" content="Learn UGC and short-form video with Exceptionel Creator Academy. Lessons, downloads, progress tracking and completion." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>✦</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{display:['Space Grotesk','sans-serif'],sans:['Inter','sans-serif']}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body class="bg-aura font-sans">
  <div id="site-header"></div>
  <main class="relative z-10">
    <div id="course"></div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (function(){
    const $=s=>document.querySelector(s);const esc=s=>(s||"").replace(/</g,"&lt;");
    const id=new URLSearchParams(location.search).get("id");
    const D=window.EXC_DATA;
    const c=(D.courses||[]).find(x=>x.id===id);

    function render(){
      if(!c){$("#course").innerHTML='<section class="section"><div class="container-x">Course not found. <a href="creator-academy.html" class="text-gradient">Back to Academy →</a></div></section>';return;}
      document.title=`${c.title} | Creator Academy`;
      const u=Store.currentUser();
      const prog=u?Store.getProgress(id):null;
      const enrolled=!!prog;
      const doneSet=new Set(prog?prog.done:[]);
      const total=c.lessons.length;
      const pct=enrolled?Math.round(doneSet.size/total*100):0;

      $("#course").innerHTML=`
      <section class="section !pb-8"><div class="container-x">
        <a href="creator-academy.html" class="text-sm text-zinc-400 hover:text-white">← Creator Academy</a>
        <div class="grid lg:grid-cols-[1.4fr_1fr] gap-10 mt-5 items-start">
          <div>
            <div class="rounded-3xl overflow-hidden mb-6" style="aspect-ratio:16/9;background:linear-gradient(135deg,${c.grad[0]},${c.grad[1]})"><div class="w-full h-full grid place-items-center text-7xl">${c.emoji}</div></div>
            <h1 class="font-display font-bold" style="font-size:clamp(1.9rem,4.5vw,3rem)">${esc(c.title)}</h1>
            <p class="text-lg text-zinc-400 mt-3">${esc(c.desc)}</p>
            ${enrolled?`<div class="mt-5"><div class="flex justify-between text-sm mb-1"><span>${doneSet.size}/${total} lessons</span><span>${prog.completed?"Completed ✓":pct+"%"}</span></div><div class="h-2 rounded-full bg-white/5 overflow-hidden"><div style="width:${pct}%;height:100%;background:var(--grad)"></div></div></div>`:""}
          </div>
          <div class="card p-6 lg:sticky lg:top-24">
            <div class="font-display font-bold text-3xl">$${c.price}</div>
            <p class="text-xs text-zinc-500 mt-1">One-time · lifetime access</p>
            ${enrolled?`<div class="mt-4 pill" style="background:var(--grad);color:#fff;border:none">Enrolled ✓</div><p class="text-sm text-zinc-400 mt-4">Jump back in below. Track your progress lesson by lesson.</p><a href="account.html#courses" class="btn btn-ghost w-full mt-4">Student dashboard</a>`:`<button class="btn btn-primary w-full mt-4" onclick="__start()">${u?"Start Learning":"Enroll & Start Learning"}</button><button class="btn btn-ghost w-full mt-2" onclick="Checkout.buyNow('${c.id}')">Buy course ($${c.price})</button><p class="text-xs text-zinc-500 mt-3 text-center">Enroll adds it to your student dashboard. Payment connects via Stripe.</p>`}
          </div>
        </div>
      </div></section>

      <section class="section !pt-0"><div class="container-x max-w-3xl">
        <h2 class="font-display font-bold text-2xl mb-4">Course content <span class="text-zinc-500 text-base font-sans">· ${total} lessons</span></h2>
        <div class="grid gap-2">${c.lessons.map((l,i)=>{const done=doneSet.has(i);return `<div class="card p-4 flex items-center gap-3">
          <button class="w-6 h-6 rounded-full grid place-items-center text-xs shrink-0 ${done?'text-white':'text-zinc-500'}" style="${done?'background:var(--grad)':'border:1px solid rgba(255,255,255,.2)'}" onclick="__toggle(${i})" ${enrolled?"":"disabled title='Enroll to track progress'"}>${done?"✓":i+1}</button>
          <div class="flex-1"><p class="text-sm ${done?'text-zinc-400 line-through':'text-zinc-100'}">${esc(l)}</p></div>
          <span class="text-xs text-zinc-600">Video + notes</span>
          <button class="text-xs text-zinc-500 hover:text-white" onclick="toast('Lesson videos & downloads unlock once media/file storage is connected.')">Open</button>
        </div>`;}).join("")}</div>
        ${enrolled&&prog.completed?`<div class="card p-6 text-center mt-6"><div class="text-4xl mb-2">🎓</div><p class="font-semibold">Course complete!</p><p class="text-sm text-zinc-400 mt-1">Certificates generate once the backend is connected.</p></div>`:""}
        <div class="mt-6"><h3 class="font-semibold mb-2">Downloads</h3><div class="card p-4 flex items-center justify-between"><span class="text-sm text-zinc-400">Worksheets & templates</span><button class="btn btn-ghost btn-sm" onclick="toast('Downloadable resources unlock once file storage is connected.')">Download pack</button></div></div>
      </div></section>`;
    }
    window.__start=()=>{const u=Store.currentUser();if(!u){Auth.open('signup',{role:'customer',redirect:location.href});return;}Store.enroll(id);toast("Enrolled — happy learning!");render();};
    window.__toggle=(i)=>{const u=Store.currentUser();if(!u){Auth.open('login');return;}Store.toggleLesson(id,i,c.lessons.length);render();};

    function boot(){if(!window.Store){setTimeout(boot,30);return;}render();}
    document.addEventListener("DOMContentLoaded",boot);
  })();
  </script>
</body>
</html>
